<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos</title>
  <style>
    body {
      background-color: #222;
    }
    .heaeder {
      width: 100dvw;
      height: 70px;
      display: flex;
      align-items: center;
    }

    .header_ul {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: row;
      gap: 10px;
    }

    .container {
      padding: 40px;
      border-radius: 8px;
      width: 1080px;
      max-width: 420px;
    }

    .form {
      display: flex;
      gap: 10px;
      flex-direction: row;
      align-items: flex-start;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 10px;
    }
    input {
      width: 140px;
      padding: 14px;
      color: aliceblue;
      background-color: #0f172a;
    }

    .form_submit {
      padding: 10px;
      background-color: transparent;
      color: aliceblue;
      border:  none;
      outline: none;
      cursor: pointer;
      border-bottom: 2px solid green;
    }
  </style>
</head>
<body>
  <!-- <header class="header">
    <ul class="header_ul">
      <li class="header_items"><a href="/" class="header_link">item 1</a></li>
      <li class="header_items"><a href="/courses" class="header_link">item 2</a></li>
    </ul>
  </header> -->
  <div class="container">
    <form method="post" action="/courses" class="form">
      <label>
        Nuevo curso:
        <input type="text" name="course" placeholder="Nuevo Curso" required>
      </label>
    
      <button type="submit" class="form_submit">Agregar curso</button>
    </form>
    <p class="message"></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const message = document.querySelector(".message");
  
    if (params.get("success") === "1") {
      message.textContent = "✅ Curso guardada correctamente";
      message.style.color = "green";
    }
  </script>
</body>
</html>
